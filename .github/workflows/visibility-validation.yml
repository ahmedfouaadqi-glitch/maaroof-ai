name: Visibility Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/routes/api/visibility.ts"
      - "src/lib/visibility-normalization.ts"
      - "src/lib/visibility-normalization.test.ts"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/visibility-validation.yml"
  push:
    branches: [feat/admin-knowledge-spaces-readonly]
    paths:
      - "src/routes/api/visibility.ts"
      - "src/lib/visibility-normalization.ts"
      - "src/lib/visibility-normalization.test.ts"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/visibility-validation.yml"

permissions:
  contents: read

jobs:
  validate-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test visibility normalization
        run: bun run test -- src/lib/visibility-normalization.test.ts
      - name: Lint visibility code
        run: bunx eslint src/lib/visibility-normalization.ts src/lib/visibility-normalization.test.ts
      - name: Type-check project
        run: bunx tsc --noEmit
      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build

  visibility-quota-db:
    name: Local Supabase migration and quota permission tests
    needs: validate-visibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start isolated local Supabase and apply migrations
        run: supabase start
      - name: Run database tests
        run: supabase test db
