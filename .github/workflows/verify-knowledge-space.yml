name: Verify knowledge-space interview
on:
  push:
    branches:
      - feat/knowledge-space-reactbits-guidance
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run test suite
        run: bun run test
      - name: Lint interview helpers and tests
        run: bunx eslint src/lib/maaroof/interview-questions.ts src/lib/__tests__/interview-questions.test.ts --rule=prettier/prettier:off
      - name: Print canonical formatting of interview test
        run: |
          bunx prettier --write src/lib/__tests__/interview-questions.test.ts
          echo "===INTERVIEW_TEST_START==="
          cat src/lib/__tests__/interview-questions.test.ts
          echo "===INTERVIEW_TEST_END==="
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Build production bundle
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build
