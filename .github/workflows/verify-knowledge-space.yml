name: Verify knowledge-space UI
on:
  push:
    branches:
      - feat/knowledge-space-reactbits-guidance
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run test suite
        run: bun run test
      - name: Build production bundle
        run: bun run build
