name: Validate Maaroof
on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
permissions:
  contents: read
jobs:
  test-and-build:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test -- --reporter=dot
      - name: Build application
        run: bun run build
