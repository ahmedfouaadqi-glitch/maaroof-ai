name: Validate Maaroof
on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
permissions:
  contents: read
jobs:
  test-and-build:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test -- --reporter=dot
      - name: Lint changed report and safety modules
        run: bunx eslint src/lib/reports src/lib/non-destructive-mode.ts src/lib/non-destructive-mode.test.ts src/lib/export-worksheet-name.ts src/lib/export-worksheet-name.test.ts src/lib/export-bus.ts src/lib/export-bus.test.ts src/lib/maaroof/execution-evidence-pack.ts src/lib/maaroof/execution-evidence-pack.test.ts --rule "prettier/prettier: off"
      - name: Run repository lint (baseline diagnostic)
        continue-on-error: true
        run: bun run lint
      - name: TypeScript validation
        run: bunx tsc --noEmit
      - name: Build application
        run: bun run build
