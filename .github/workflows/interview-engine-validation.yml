name: Interview Engine Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/maaroof/interview-engine.ts"
      - "src/lib/maaroof/interview-context.ts"
      - "src/lib/maaroof/interview-engine.test.ts"
      - "src/lib/maaroof/interview-context.test.ts"
      - "src/lib/maaroof/interview-question-bank.ts"
      - "src/lib/maaroof/interview-question-bank.test.ts"
      - "src/components/workspace/InterviewPanel.tsx"
      - "src/routes/workspace.tsx"
      - "src/routes/profile.tsx"
      - "src/lib/auth.tsx"
      - "src/routes/api/maaroof-interviews.ts"
      - "src/routes/api/maaroof-interviews.test.ts"
      - "src/routeTree.gen.ts"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "docs/MAAROOF-IMPLEMENTATION-NO-CLOUDFLARE.md"
      - ".github/workflows/**"
  push:
    branches:
      - feat/maaroof-interview-foundation-no-cloudflare
    paths:
      - "src/lib/maaroof/interview-engine.ts"
      - "src/lib/maaroof/interview-context.ts"
      - "src/lib/maaroof/interview-engine.test.ts"
      - "src/lib/maaroof/interview-context.test.ts"
      - "src/lib/maaroof/interview-question-bank.ts"
      - "src/lib/maaroof/interview-question-bank.test.ts"
      - "src/components/workspace/InterviewPanel.tsx"
      - "src/routes/workspace.tsx"
      - "src/routes/profile.tsx"
      - "src/lib/auth.tsx"
      - "src/routes/api/maaroof-interviews.ts"
      - "src/routes/api/maaroof-interviews.test.ts"
      - "src/routeTree.gen.ts"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "docs/MAAROOF-IMPLEMENTATION-NO-CLOUDFLARE.md"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate-interview-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run interview and API tests
        run: bun run test -- src/lib/maaroof/interview-engine.test.ts src/lib/maaroof/interview-context.test.ts src/lib/maaroof/interview-question-bank.test.ts src/routes/api/maaroof-interviews.test.ts

      - name: Lint interview engine
        run: bunx eslint src/lib/maaroof/interview-engine.ts src/lib/maaroof/interview-context.ts src/lib/maaroof/interview-context.test.ts src/lib/maaroof/interview-engine.test.ts src/lib/maaroof/interview-question-bank.ts src/lib/maaroof/interview-question-bank.test.ts src/routes/api/maaroof-interviews.ts src/routes/api/maaroof-interviews.test.ts src/components/workspace/InterviewPanel.tsx

      - name: Type-check project
        run: bunx tsc --noEmit

      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build
  interview-rls:
    name: Local Supabase migration and RLS tests
    needs: validate-interview-engine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase start

      - name: Apply all migrations to the local database
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db
