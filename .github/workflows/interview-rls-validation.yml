name: Interview RLS Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/interview-rls-validation.yml"
  push:
    branches:
      - feat/maaroof-interview-foundation-no-cloudflare
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/interview-rls-validation.yml"

permissions:
  contents: read

jobs:
  interview-rls:
    name: Local Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase start

      - name: Apply all migrations to the local database
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db
