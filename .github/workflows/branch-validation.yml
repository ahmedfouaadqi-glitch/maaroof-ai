name: Branch Validation

on:
  push:
    branches:
      - feat/maaroof-skills-workspace-clean
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint changed workspace and licensing files
        run: >-
          bunx eslint
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'
          --rule 'no-empty: off'
          --rule 'prefer-const: off'
          src/routes/workspace.tsx
          src/routes/api/maaroof.ts
          src/routes/api/analyze.ts
          src/routes/api/compare.ts
          src/routes/api/known.ts
          src/routes/api/research.ts
          src/routes/api/visibility.ts
          src/lib/tokens.server.ts
          src/lib/maaroof/skill-access-policy.ts
          src/lib/maaroof/skill-access-policy.test.ts
          src/components/admin/WorkbenchSettingsPanel.tsx
          src/components/admin/SkillAccessOverrides.tsx
          src/components/admin/ToolAccessOverrides.tsx
          src/routes/admin.tsx
          src/routes/api/maaroof-jobs.ts
          src/lib/maaroof/background-jobs.server.ts
          src/lib/request-ctx.server.ts
          src/server.ts

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build production bundle
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build
